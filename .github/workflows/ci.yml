name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout hif-muffin
        uses: actions/checkout@v4
        with:
          path: hif-muffin

      - name: Load pinned upstream refs
        run: grep -v '^#' hif-muffin/.ci/pinned-refs.env | grep -v '^$' >> "$GITHUB_ENV"

      - name: Checkout hif-core (pinned)
        uses: actions/checkout@v4
        with:
          repository: esd-univr/hif-core
          ref: ${{ env.HIF_CORE_REF }}
          path: hif-core

      - name: Checkout hif-frontend (pinned)
        uses: actions/checkout@v4
        with:
          repository: esd-univr/hif-frontend
          ref: ${{ env.HIF_FRONTEND_REF }}
          path: hif-frontend

      - name: Checkout hif-backend (pinned)
        uses: actions/checkout@v4
        with:
          repository: esd-univr/hif-backend
          ref: ${{ env.HIF_BACKEND_REF }}
          path: hif-backend

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} libpoco-dev flex bison

      - name: Build hif-core
        run: |
          cmake -B hif-core/build -S hif-core
          cmake --build hif-core/build --parallel 2

      - name: Build hif-frontend
        run: |
          cmake -B hif-frontend/build -S hif-frontend
          cmake --build hif-frontend/build --parallel 2

      - name: Build hif-backend
        run: |
          cmake -B hif-backend/build -S hif-backend
          cmake --build hif-backend/build --parallel 2

      - name: Configure hif-muffin
        run: cmake -B hif-muffin/build -S hif-muffin -DWARNINGS_AS_ERRORS=ON -DSTRICT_WARNINGS=ON

      - name: Build hif-muffin
        run: cmake --build hif-muffin/build --parallel 2

      - name: Test
        run: ctest --test-dir hif-muffin/build --output-on-failure
